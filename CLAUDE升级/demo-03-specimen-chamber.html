<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>混合体样本舱 — CodeRains 改版</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020a14;
    font-family: 'Georgia', 'Noto Serif SC', 'SimSun', serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #container {
    position: fixed;
    inset: 0;
    cursor: grab;
  }
  #container:active { cursor: grabbing; }
  #container canvas { display: block; }

  /* 暗角 */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(2,8,18,0.7) 100%);
    z-index: 10;
  }

  /* 信息面板 */
  #info {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: none;
    text-align: center;
    color: rgba(140,200,220,0.7);
    font-size: 13px;
    letter-spacing: 2px;
    line-height: 2;
  }
  #info .title {
    font-size: 18px;
    letter-spacing: 4px;
    color: rgba(180,220,240,0.85);
    margin-bottom: 2px;
  }
  #info .hint {
    color: rgba(100,160,200,0.5);
    font-size: 12px;
    margin-top: 6px;
  }

  /* 状态标签 */
  #status {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 20;
    pointer-events: none;
    font-family: 'Courier New', 'SimHei', monospace;
    font-size: 12px;
    color: rgba(100,180,200,0.6);
    text-align: right;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div id="container"></div>
<div id="vignette"></div>
<div id="info">
  <div class="title">混合体样本 · 打捞舱</div>
  <div>舱体残骸 + 生物组织反向生长</div>
  <div class="hint">🖱 拖拽旋转观察 · 滚轮缩放</div>
</div>
<div id="status">
  <div id="statusText">样本状态：稳定</div>
  <div id="fpsText">FPS: --</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.177.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.177.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ 基础场景 ============
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020d1a, 0.012);
scene.background = new THREE.Color(0x020d1a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 30);
camera.position.set(2.5, 1.8, 6.5);
camera.lookAt(0, 0.2, 0);

// OrbitControls — 限制旋转范围
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.5;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.7;
controls.minPolarAngle = Math.PI * 0.2;
controls.maxAzimuth = Math.PI / 5;
controls.minAzimuth = -Math.PI / 5;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.update();

// ============ 光照 ============
// 环境光 — 深海暗度
const ambientLight = new THREE.AmbientLight(0x1a3a5a, 0.7);
scene.add(ambientLight);

// 主观察光源（从右上方打下来）
const keyLight = new THREE.SpotLight(0xc8e8ff, 18, 14, Math.PI / 4, 0.3, 0.5);
keyLight.position.set(4, 5, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

// 补光
const fillLight = new THREE.PointLight(0x3060a0, 6, 8);
fillLight.position.set(-2, 1, -1);
scene.add(fillLight);

// 生物荧光（残骸内部，脉动）
const bioLight1 = new THREE.PointLight(0x40d0ff, 8, 3);
bioLight1.position.set(0.2, 0.1, 0.4);
scene.add(bioLight1);

const bioLight2 = new THREE.PointLight(0x8040e0, 5, 2.5);
bioLight2.position.set(-0.6, -0.2, -0.5);
scene.add(bioLight2);

const bioLight3 = new THREE.PointLight(0x30c0a0, 4, 2);
bioLight3.position.set(0.6, 0.3, -0.3);
scene.add(bioLight3);

// ============ 材质工厂 ============
// 暗金属（舱体）
const metalMat = new THREE.MeshStandardMaterial({
  color: 0x3a4a58,
  roughness: 0.55,
  metalness: 0.8,
});

// 腐蚀金属
const rustMat = new THREE.MeshStandardMaterial({
  color: 0x4a4038,
  roughness: 0.7,
  metalness: 0.6,
});

// 结构框架
const frameMat = new THREE.MeshStandardMaterial({
  color: 0x2a3848,
  roughness: 0.4,
  metalness: 0.9,
});

// 生物组织（紫）
const tissueMatA = new THREE.MeshPhysicalMaterial({
  color: 0x6040a0,
  roughness: 0.3,
  metalness: 0.05,
  clearcoat: 0.1,
  transparent: true,
  opacity: 0.85,
});

// 生物组织（蓝绿荧光）
const tissueMatB = new THREE.MeshPhysicalMaterial({
  color: 0x2080a0,
  roughness: 0.25,
  metalness: 0.05,
  emissive: 0x104050,
  emissiveIntensity: 0.3,
  clearcoat: 0.15,
  transparent: true,
  opacity: 0.8,
});

// 生物组织（深紫半透明）
const tissueMatC = new THREE.MeshPhysicalMaterial({
  color: 0x502070,
  roughness: 0.2,
  metalness: 0.02,
  transmission: 0.3,
  thickness: 0.4,
  transparent: true,
  opacity: 0.75,
});

// 玻璃观察舱
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x88bbdd,
  roughness: 0.05,
  metalness: 0.05,
  transmission: 0.88,
  thickness: 0.6,
  ior: 1.4,
  transparent: true,
  opacity: 0.35,
});

// ============ 舱体残骸 ============
const wreckGroup = new THREE.Group();
scene.add(wreckGroup);

// 主体 — 变形胶囊/箱体
const bodyGeo = new THREE.BoxGeometry(1.6, 0.9, 2.4, 8, 6, 10);
// 顶点位移制造损伤
const bodyPos = bodyGeo.attributes.position;
const bodyOrig = new Float32Array(bodyPos.count * 3);
for (let i = 0; i < bodyPos.count; i++) {
  bodyOrig[i*3] = bodyPos.getX(i);
  bodyOrig[i*3+1] = bodyPos.getY(i);
  bodyOrig[i*3+2] = bodyPos.getZ(i);

  const x = bodyPos.getX(i), y = bodyPos.getY(i), z = bodyPos.getZ(i);
  // 顶部凹陷
  if (y > 0.3 && Math.abs(x) < 0.5 && Math.abs(z) < 0.7) {
    bodyPos.setY(i, y - 0.15 * (1 - Math.abs(x)/0.5) * (1 - Math.abs(z)/0.7));
  }
  // 侧面裂口
  if (Math.abs(x) > 0.6 && Math.abs(z) < 0.5 && y < 0.2 && y > -0.3) {
    bodyPos.setX(i, x * (1 + 0.25 * Math.random()));
  }
  // 底部变形
  if (y < -0.35) {
    bodyPos.setY(i, y - Math.random() * 0.15);
  }
  // 前部撞击凹陷
  if (z > 0.8 && Math.abs(x) < 0.5 && y < 0.15) {
    bodyPos.setZ(i, z - 0.2 * (1 - Math.abs(x)/0.5) * (1 - Math.abs(y-0.15)/0.4));
  }
}
bodyGeo.computeVertexNormals();

const bodyMesh = new THREE.Mesh(bodyGeo, metalMat);
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
bodyMesh.name = 'cabinBody';
wreckGroup.add(bodyMesh);

// 结构框架线（暴露在裂口处）
const edgeGeo = new THREE.EdgesGeometry(bodyGeo, 25);
const edgeLine = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
  color: 0x4a6070,
  transparent: true,
  opacity: 0.5,
}));
wreckGroup.add(edgeLine);

// 残骸碎片 — 弯曲金属板
for (let i = 0; i < 4; i++) {
  const fragGeo = new THREE.BoxGeometry(0.3 + Math.random()*0.3, 0.05, 0.5 + Math.random()*0.4);
  const frag = new THREE.Mesh(fragGeo, rustMat);
  const side = (i % 2 === 0) ? 1 : -1;
  frag.position.set(
    side * (0.85 + Math.random() * 0.25),
    -0.25 + Math.random() * 0.4,
    (i - 1.5) * 0.7
  );
  frag.rotation.set(
    (Math.random() - 0.5) * 0.6,
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.8
  );
  frag.castShadow = true;
  wreckGroup.add(frag);
}

// ============ 生物组织（生长在残骸上） ============
const tissueGroup = new THREE.Group();
wreckGroup.add(tissueGroup);

// 存储需要呼吸动画的组织 mesh
const breathingMeshes = [];

/** 创建一团组织 */
function createTissueCluster(x, y, z, scale, material, rotX = 0, rotY = 0, rotZ = 0) {
  const cluster = new THREE.Group();
  cluster.position.set(x, y, z);
  cluster.rotation.set(rotX, rotY, rotZ);

  // 主体 — 变形球体
  const mainGeo = new THREE.SphereGeometry(0.15 * scale, 16, 12);
  const mainPos = mainGeo.attributes.position;
  for (let i = 0; i < mainPos.count; i++) {
    const px = mainPos.getX(i), py = mainPos.getY(i), pz = mainPos.getZ(i);
    const noise = 1 + (Math.sin(px*8) * Math.cos(py*7) * Math.sin(pz*6)) * 0.35;
    mainPos.setXYZ(i, px * noise, py * noise, pz * noise);
  }
  mainGeo.computeVertexNormals();
  const main = new THREE.Mesh(mainGeo, material);
  main.userData.origPositions = new Float32Array(mainPos.count * 3);
  for (let i = 0; i < mainPos.count; i++) {
    main.userData.origPositions[i*3] = mainPos.getX(i);
    main.userData.origPositions[i*3+1] = mainPos.getY(i);
    main.userData.origPositions[i*3+2] = mainPos.getZ(i);
  }
  breathingMeshes.push(main);
  cluster.add(main);

  // 附属小组织块
  for (let i = 0; i < 3; i++) {
    const subGeo = new THREE.SphereGeometry(0.06 * scale * (0.6 + Math.random()), 8, 6);
    const sub = new THREE.Mesh(subGeo, material);
    sub.position.set(
      (Math.random() - 0.5) * 0.2 * scale,
      (Math.random() - 0.5) * 0.2 * scale,
      (Math.random() - 0.5) * 0.2 * scale
    );
    cluster.add(sub);
  }

  // 蠕虫状延伸
  const tentGeo = new THREE.TorusGeometry(0.05 * scale, 0.02 * scale, 8, 12, Math.PI * 1.5);
  const tent = new THREE.Mesh(tentGeo, material);
  tent.position.set(0.08 * scale, 0, 0);
  tent.rotation.z = Math.PI * 0.3;
  cluster.add(tent);

  return cluster;
}

// 顶部裂口处的组织（大型）
const t1 = createTissueCluster(0, 0.35, -0.2, 1.2, tissueMatA, 0.2, -0.3, 0);
tissueGroup.add(t1);

// 侧面生长的组织
const t2 = createTissueCluster(0.75, -0.05, -0.4, 1.0, tissueMatB, 0, 0.4, -0.5);
tissueGroup.add(t2);

// 前面破口的组织
const t3 = createTissueCluster(-0.15, -0.2, 1.1, 1.1, tissueMatC, -0.3, 0.1, 0.3);
tissueGroup.add(t3);

// 底部延伸的组织
const t4 = createTissueCluster(0.4, -0.4, 0.3, 0.9, tissueMatA, 0.5, 0, -0.2);
tissueGroup.add(t4);

// 后面裂缝组织
const t5 = createTissueCluster(-0.5, 0.15, -1.0, 0.85, tissueMatB, -0.2, 0.6, 0);
tissueGroup.add(t5);

// 额外小组织散布
const t6 = createTissueCluster(0.3, 0.2, -0.7, 0.6, tissueMatC, 0.8, -0.5, 0.4);
tissueGroup.add(t6);

// ============ 组织连接管/丝 ============
function createTissueTube(start, end, material) {
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const tubeGeo = new THREE.CylinderGeometry(0.025, 0.03, len, 6, 4);
  const tube = new THREE.Mesh(tubeGeo, material);
  tube.position.copy(mid);
  tube.lookAt(end);
  tube.rotateX(Math.PI / 2);
  return tube;
}

const tubeStarts = [
  new THREE.Vector3(0, 0.35, -0.2),
  new THREE.Vector3(0.75, -0.05, -0.4),
  new THREE.Vector3(-0.15, -0.2, 1.1),
];
tubeStarts.forEach(start => {
  for (let i = 0; i < 2; i++) {
    const end = start.clone().add(
      new THREE.Vector3((Math.random()-0.5)*0.8, (Math.random()-0.5)*0.4, (Math.random()-0.5)*0.5)
    );
    const tubeMaterial = Math.random() > 0.5 ? tissueMatB : tissueMatC;
    tissueGroup.add(createTissueTube(start, end, tubeMaterial));
  }
});

// ============ 观察舱玻璃框架 ============
const chamberGroup = new THREE.Group();
scene.add(chamberGroup);

// 玻璃盒
const glassGeo = new THREE.BoxGeometry(2.8, 2.4, 3.4);
const glassMesh = new THREE.Mesh(glassGeo, glassMat);
glassMesh.renderOrder = 1;
glassMesh.material.depthWrite = false;
chamberGroup.add(glassMesh);

// 金属框架（12条边）
const frameEdgeGeo = new THREE.EdgesGeometry(glassGeo);
const frameEdge = new THREE.LineSegments(frameEdgeGeo, new THREE.LineBasicMaterial({
  color: 0x607080,
  transparent: true,
  opacity: 0.6,
  linewidth: 1,
}));
frameEdge.renderOrder = 2;
chamberGroup.add(frameEdge);

// 四角立柱
const cornerPositions = [
  [-1.4, -1.2, -1.7], [1.4, -1.2, -1.7], [-1.4, -1.2, 1.7], [1.4, -1.2, 1.7],
  [-1.4, 1.2, -1.7], [1.4, 1.2, -1.7], [-1.4, 1.2, 1.7], [1.4, 1.2, 1.7],
];
cornerPositions.forEach(([cx, cy, cz]) => {
  const pillarGeo = new THREE.CylinderGeometry(0.04, 0.04, 2.4, 8);
  const pillar = new THREE.Mesh(pillarGeo, frameMat);
  pillar.position.set(cx, 0, cz);
  pillar.castShadow = true;
  chamberGroup.add(pillar);
});

// 玻璃内壁冷凝水滴
const dropletGeo = new THREE.SphereGeometry(0.025, 6, 4);
const dropletMat = new THREE.MeshPhysicalMaterial({
  color: 0xaaccdd,
  roughness: 0.1,
  metalness: 0.05,
  transparent: true,
  opacity: 0.5,
});
for (let i = 0; i < 35; i++) {
  const droplet = new THREE.Mesh(dropletGeo, dropletMat);
  // 随机分布在玻璃内壁
  const face = Math.floor(Math.random() * 6);
  const u = (Math.random() - 0.5) * 2;
  const v = (Math.random() - 0.5) * 2;
  switch (face) {
    case 0: droplet.position.set(1.38, u * 1.15, v * 1.65); break; // +X
    case 1: droplet.position.set(-1.38, u * 1.15, v * 1.65); break; // -X
    case 2: droplet.position.set(u * 1.35, 1.18, v * 1.65); break; // +Y
    case 3: droplet.position.set(u * 1.35, -1.18, v * 1.65); break; // -Y
    case 4: droplet.position.set(u * 1.35, v * 1.15, 1.68); break; // +Z
    case 5: droplet.position.set(u * 1.35, v * 1.15, -1.68); break; // -Z
  }
  chamberGroup.add(droplet);
}

// ============ 漂浮微粒（海洋雪） ============
const particlesGeo = new THREE.BufferGeometry();
const particleCount = 200;
const particlePositions = new Float32Array(particleCount * 3);
const particleSizes = new Float32Array(particleCount);
for (let i = 0; i < particleCount; i++) {
  particlePositions[i*3] = (Math.random() - 0.5) * 4;
  particlePositions[i*3+1] = (Math.random() - 0.5) * 3;
  particlePositions[i*3+2] = (Math.random() - 0.5) * 5;
  particleSizes[i] = Math.random() * 3 + 1;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particlesGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
const particlesMat = new THREE.PointsMaterial({
  color: 0x88bbdd,
  size: 0.02,
  transparent: true,
  opacity: 0.5,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// ============ 海底底座/支架 ============
const baseGeo = new THREE.CylinderGeometry(1.6, 1.8, 0.25, 32);
const base = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({
  color: 0x2a3848,
  roughness: 0.6,
  metalness: 0.7,
}));
base.position.y = -1.5;
base.receiveShadow = true;
scene.add(base);

// 底座环形光带
const ringGeo = new THREE.TorusGeometry(1.7, 0.03, 16, 64);
const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
  color: 0x3090b0,
  transparent: true,
  opacity: 0.4,
}));
ring.rotation.x = Math.PI / 2;
ring.position.y = -1.35;
scene.add(ring);

// ============ 底部轻微雾气平面 ============
const mistGeo = new THREE.PlaneGeometry(6, 6);
const mistMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0x051525) },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    uniform vec3 uColor;
    void main() {
      float alpha = smoothstep(0.0, 1.0, vUv.y) * 0.25;
      alpha *= 0.5 + 0.5 * sin(vUv.x * 5.0 + uTime * 0.3) * sin(vUv.y * 3.0 + uTime * 0.2);
      gl_FragColor = vec4(uColor, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
});
const mistPlane = new THREE.Mesh(mistGeo, mistMat);
mistPlane.rotation.x = -Math.PI / 2;
mistPlane.position.y = -1.4;
scene.add(mistPlane);

// ============ 响应式处理 ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ 动画循环 ============
const clock = new THREE.Clock();
let fpsFrames = 0, fpsTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const t = performance.now() * 0.001;

  controls.update();

  // 生物组织呼吸脉动
  const breathe = Math.sin(t * 1.3) * 0.08 + Math.sin(t * 2.1) * 0.05;
  breathingMeshes.forEach(mesh => {
    if (!mesh.userData.origPositions) return;
    const pos = mesh.geometry.attributes.position;
    const orig = mesh.userData.origPositions;
    const noiseScale = 0.03;
    for (let i = 0; i < pos.count; i++) {
      const ox = orig[i*3], oy = orig[i*3+1], oz = orig[i*3+2];
      const d = Math.sqrt(ox*ox + oy*oy + oz*oz);
      const displacement = breathe * (1 + 0.5 * Math.sin(d * 4 + t)) * d;
      const nx = ox / (d || 0.001), ny = oy / (d || 0.001), nz = oz / (d || 0.001);
      pos.setXYZ(i,
        ox + nx * displacement + Math.sin(t*3 + oy*5) * noiseScale,
        oy + ny * displacement + Math.cos(t*2.5 + ox*4) * noiseScale,
        oz + nz * displacement + Math.sin(t*2.8 + oz*5) * noiseScale
      );
    }
    pos.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
  });

  // 生物荧光脉动
  const bioPulse1 = 1 + Math.sin(t * 1.5) * 0.25 + Math.sin(t * 2.3 + 1.2) * 0.15;
  const bioPulse2 = 1 + Math.sin(t * 1.8 + 2.1) * 0.3 + Math.cos(t * 2.6) * 0.12;
  const bioPulse3 = 1 + Math.cos(t * 1.6 + 1.0) * 0.2 + Math.sin(t * 2.9) * 0.18;
  bioLight1.intensity = 8 * bioPulse1;
  bioLight2.intensity = 5 * bioPulse2;
  bioLight3.intensity = 4 * bioPulse3;

  // 漂浮微粒缓慢漂移
  const pPos = particles.geometry.attributes.position;
  for (let i = 0; i < particleCount; i++) {
    const px = pPos.getX(i), py = pPos.getY(i), pz = pPos.getZ(i);
    pPos.setXYZ(i,
      px + Math.sin(t * 0.5 + py) * 0.002,
      py + Math.cos(t * 0.4 + px) * 0.003,
      pz + Math.cos(t * 0.45 + py) * 0.002
    );
    // 循环
    if (py > 1.5) pPos.setY(i, -1.5);
    if (py < -1.5) pPos.setY(i, 1.5);
  }
  particles.geometry.attributes.position.needsUpdate = true;

  // 底座环形光带脉动
  ring.material.opacity = 0.3 + Math.sin(t * 0.7) * 0.15 + Math.sin(t * 1.9) * 0.08;

  // 雾气更新
  mistPlane.material.uniforms.uTime.value = t;

  // 渲染
  renderer.render(scene, camera);

  // FPS
  fpsFrames++;
  if (t - fpsTime >= 1) {
    document.getElementById('fpsText').textContent = `FPS: ${fpsFrames}`;
    fpsFrames = 0;
    fpsTime = t;
  }

  // 样本状态
  const statusEl = document.getElementById('statusText');
  if (breathe > 0.05) statusEl.textContent = '样本状态：活跃';
  else if (breathe < -0.05) statusEl.textContent = '样本状态：收缩';
  else statusEl.textContent = '样本状态：稳定';
}

animate();

console.log('🧬 混合体样本舱已启动');
console.log('   拖拽旋转观察 · 滚轮缩放');
console.log('   舱体残骸 + 生物组织反向生长');
console.log('   对应文档 §7.4');
</script>
