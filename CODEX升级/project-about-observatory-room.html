<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About 潜水艇舱室验证</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --text: #f3f7fb;
      --lamp-on: 1;
      --room-light: 1;
      --interior-strength: 0;
      --hull-visibility: 1;
      --porthole-scale: 1;
      --planet-core-opacity: 0;
      --room-reveal: 240px;
    }
    html, body {
      min-height: 100%;
      background: #03101b;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 14%, rgba(101, 170, 211, 0.2), transparent 22%),
        radial-gradient(circle at 84% 9%, rgba(48, 112, 156, 0.16), transparent 18%),
        linear-gradient(180deg, #0d2236 0%, #08192a 32%, #04111d 70%, #020811 100%);
    }
    a { color: inherit; text-decoration: none; }
    .blank-panel {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(124, 176, 210, 0.18), transparent 18%),
        radial-gradient(circle at 78% 16%, rgba(76, 136, 182, 0.16), transparent 15%),
        linear-gradient(180deg, #10263a 0%, #071524 52%, #030a12 100%);
    }
    .blank-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(188, 221, 242, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(188, 221, 242, 0.05) 1px, transparent 1px);
      background-size: 56px 56px;
      opacity: 0.2;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.12));
    }
    .blank-panel span {
      position: relative;
      z-index: 1;
      padding: 1rem 1.25rem;
      border-radius: 999px;
      border: 1px solid rgba(192, 216, 230, 0.2);
      background: rgba(6, 15, 24, 0.28);
      backdrop-filter: blur(12px);
      color: rgba(232, 241, 247, 0.88);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    .about-scroll { position: relative; height: 600vh; }
    .about-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 20% 16%, rgba(53, 112, 156, 0.28), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(29, 80, 125, 0.22), transparent 20%),
        linear-gradient(180deg, #112a40 0%, #082033 40%, #04111d 72%, #020812 100%);
    }
    .room-scene, .room-layer, .water-caustics, .interior, .hull-overlay, .detail-overlay { position: absolute; inset: 0; }
    .room-scene {
      z-index: 1;
      filter: brightness(var(--room-light)) saturate(calc(0.94 + var(--lamp-on) * 0.12));
      transition: filter 0.2s linear;
      clip-path: circle(var(--room-reveal) at 50% 50%);
    }
    .room-layer { background-position: center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.3s ease; }
    .room-lit { background-image: url("../舱室开灯.png"); opacity: var(--lamp-on); }
    .room-dark { background-image: url("../舱室关灯.png"); opacity: calc(1 - var(--lamp-on)); }
    .water-caustics {
      z-index: 2;
      pointer-events: none;
      opacity: calc(0.16 + var(--lamp-on) * 0.08);
      clip-path: circle(var(--room-reveal) at 50% 50%);
      background:
        radial-gradient(circle at 28% 24%, rgba(179, 239, 255, 0.18), transparent 18%),
        radial-gradient(circle at 72% 18%, rgba(118, 223, 255, 0.12), transparent 15%),
        radial-gradient(circle at 58% 58%, rgba(149, 233, 255, 0.08), transparent 20%);
      mix-blend-mode: screen;
    }
    .interior {
      z-index: 3;
      opacity: calc(0.04 + var(--interior-strength) * 0.96);
      transform: scale(calc(0.94 + var(--interior-strength) * 0.06));
      clip-path: circle(var(--room-reveal) at 50% 50%);
      transition: opacity 0.08s linear, transform 0.08s linear;
    }
    .about-room { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }
    .about-plaque {
      position: absolute;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(200, 223, 235, 0.18);
      background: rgba(5, 14, 22, 0.12);
      backdrop-filter: blur(8px);
      color: rgba(242, 248, 251, 0.78);
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: calc(0.3 + var(--interior-strength) * 0.42);
      pointer-events: none;
    }
    .warm-glow {
      position: absolute;
      top: 12.5rem;
      left: 3.4rem;
      width: 12.5rem;
      height: 12.5rem;
      border-radius: 50%;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 207, 128, 0.34) 0%, rgba(255, 218, 146, 0.14) 42%, transparent 76%);
      filter: blur(26px);
      opacity: calc(var(--lamp-on) * 0.42);
      animation: pulse 3.4s ease-in-out infinite alternate;
      transition: opacity 0.25s ease;
    }
    .lamp-shell {
      position: absolute;
      left: 0.6rem;
      top: 16rem;
      width: clamp(10rem, 18vw, 16rem);
      height: clamp(10rem, 18vw, 16rem);
      z-index: 6;
      opacity: calc(0.72 + var(--interior-strength) * 0.18);
    }
    .lamp-mount { width: 100%; height: 100%; min-height: 320px; cursor: pointer; }
    .planet-wrap {
      position: absolute;
      top: -2.5rem;
      right: -3.6rem;
      width: clamp(22rem, 38vw, 36rem);
      height: clamp(22rem, 38vw, 36rem);
      z-index: 5;
      opacity: calc(0.64 + (1 - var(--lamp-on)) * 0.16);
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .planet-system { position: relative; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    .planet-ring { position: absolute; border: 2px solid rgba(255, 255, 255, 0.28); border-radius: 50%; pointer-events: none; }
    .planet-orbit { position: absolute; left: 50%; top: 50%; animation: rotateRing linear infinite; }
    .planet-icon-link {
      position: absolute;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      pointer-events: auto;
      transition: transform 0.2s ease;
    }
    .planet-icon-link img, .planet-icon-link svg { width: 36px; height: 36px; display: block; color: #fff; fill: currentColor; }
    .planet-core-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 172px;
      height: 172px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: var(--planet-core-opacity);
      transition: opacity 0.6s ease;
      background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.98) 18%, rgba(255, 255, 255, 0.84) 36%, rgba(255, 255, 255, 0.46) 58%, rgba(255, 255, 255, 0.14) 78%, transparent 100%);
      box-shadow: 0 0 74px rgba(255, 255, 255, 0.78), 0 0 154px rgba(255, 255, 255, 0.38), 0 0 220px rgba(188, 224, 255, 0.18);
    }
    .planet-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 0.3rem 0.55rem;
      border-radius: 0.4rem;
      background: #22c55e;
      color: #fff;
      font-size: 0.75rem;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 3;
    }
    .planet-toast.show { opacity: 1; }
    .floor-cards {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      opacity: calc(0.18 + var(--interior-strength) * 0.82);
      transition: opacity 0.2s ease;
    }
    .floor-cards::before {
      content: "";
      position: absolute;
      left: 40.4%;
      top: 77.9%;
      width: 25.3%;
      height: 14.2%;
      clip-path: polygon(16% 0%, 84% 0%, 100% 100%, 0% 100%);
      background:
        radial-gradient(circle at 50% 60%, rgba(10, 29, 46, 0.12), rgba(4, 15, 24, 0.03) 54%, transparent 78%),
        linear-gradient(180deg, rgba(160, 208, 228, 0.02), transparent 28%);
      pointer-events: none;
    }
    .floor-cards.detail-open .floor-card { opacity: 0.3; filter: blur(2px); }
    .floor-card {
      position: absolute;
      width: var(--card-width);
      aspect-ratio: 0.68;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      transform: translate(-50%, -50%) rotateZ(var(--card-rotate)) skewX(-8deg) scaleY(0.84) scale(var(--card-scale));
      transform-origin: center center;
      filter: saturate(0.92) brightness(0.94);
      transition: transform 0.28s ease, opacity 0.2s ease, filter 0.2s ease;
      opacity: 0.92;
    }
    .floor-card:hover {
      transform: translate(-50%, calc(-50% - 8px)) rotateZ(var(--card-rotate)) skewX(-8deg) scaleY(0.84) scale(calc(var(--card-scale) + 0.035));
    }
    .floor-card.is-hidden { opacity: 0; pointer-events: none; }
    .floor-card-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(6, 30, 52, 0.16), 0 1px 0 rgba(255, 255, 255, 0.14) inset;
      background: linear-gradient(180deg, rgba(240, 248, 253, 0.22), rgba(211, 233, 244, 0.08));
    }
    .floor-card-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 34%, transparent 62%, rgba(255, 255, 255, 0.12));
      pointer-events: none;
    }
    .floor-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      user-select: none;
      pointer-events: none;
    }
    .detail-overlay {
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      backdrop-filter: blur(0px);
    }
    .detail-overlay.is-active {
      opacity: 1;
      pointer-events: auto;
      backdrop-filter: blur(10px);
      background: rgba(5, 15, 24, 0.14);
    }
    .detail-panel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(1080px, 88vw);
      transform: translate(-50%, calc(-50% + 18px));
      opacity: 0;
      transition: opacity 0.24s ease, transform 0.24s ease;
    }
    .detail-panel.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%);
    }
    .detail-close {
      position: absolute;
      top: -0.25rem;
      right: 0.25rem;
      width: 2.4rem;
      height: 2.4rem;
      border: 0;
      border-radius: 999px;
      background: rgba(13, 26, 38, 0.48);
      color: rgba(241, 247, 250, 0.85);
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 2;
    }
    .testimonials-outer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
      font-family: inherit;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .testimonials-grid {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 6rem;
      align-items: center;
    }
    .testimonials-visual { position: relative; width: 20rem; height: 500px; margin: 0 auto; }
    .testimonial-photo {
      position: absolute;
      inset: 0;
      transform-origin: bottom;
      transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out;
    }
    .testimonial-photo img {
      width: 100%;
      height: 100%;
      border-radius: 1.5rem;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      pointer-events: none;
    }
    .testimonial-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      background: rgba(31, 41, 55, 0.08);
    }
    .testimonial-photo.active { animation: activePhotoRise 0.4s ease-in-out; }
    .testimonials-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 500px;
      padding: 1rem 0;
    }
    .copy-text { transition: opacity 0.2s ease, transform 0.2s ease; text-shadow: 0 4px 18px rgba(4, 13, 20, 0.3); }
    .copy-text.updating { opacity: 0; transform: translateY(14px); }
    .copy-text h3 { font-size: 1.5rem; font-weight: 700; color: rgba(255, 255, 255, 0.94); }
    .copy-text .designation { margin-top: 0.2rem; font-size: 1rem; color: rgba(224, 231, 236, 0.72); }
    .copy-text .quote { margin-top: 2rem; font-size: 1.1rem; line-height: 1.8; color: rgba(230, 236, 240, 0.8); }
    .copy-text .quote a { color: #60a5fa; text-decoration: underline; transition: color 0.2s ease; }
    .copy-text .quote a:hover { color: #93c5fd; }
    .testimonial-controls { display: flex; gap: 1rem; padding-top: 3rem; justify-content: flex-start; }
    .testimonial-button {
      width: 2.6rem;
      height: 2.6rem;
      border: 0;
      border-radius: 999px;
      background: #262626;
      color: #a3a3a3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .testimonial-button:hover { color: #e5e5e5; }
    .testimonial-button.prev:hover svg { transform: rotate(12deg); }
    .testimonial-button.next:hover svg { transform: rotate(-12deg); }
    .testimonial-button svg {
      width: 1.25rem;
      height: 1.25rem;
      transition: transform 0.3s ease;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .floating-card {
      position: fixed;
      z-index: 11;
      overflow: hidden;
      border-radius: 1.2rem;
      box-shadow: 0 22px 54px rgba(5, 23, 38, 0.34), 0 1px 0 rgba(255, 255, 255, 0.18) inset;
      transition:
        left 0.44s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.44s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.44s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.44s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.44s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.2s ease;
      pointer-events: none;
    }
    .floating-card img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
    .hull-overlay {
      z-index: 10;
      opacity: var(--hull-visibility);
      pointer-events: none;
      transition: opacity 0.08s linear;
    }
    .hull-shell {
      position: absolute;
      inset: -18%;
      background: radial-gradient(circle at 50% 50%, transparent 0 18.8%, rgba(0, 0, 0, 0.08) 20%, rgba(13, 27, 38, 0.2) 30%, rgba(31, 54, 70, 0.38) 43%, rgba(57, 88, 109, 0.56) 57%, rgba(20, 34, 45, 0.74) 100%);
    }
    .hull-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.38) 0%, rgba(0, 0, 0, 0.16) 10%, transparent 23%, transparent 77%, rgba(0, 0, 0, 0.18) 90%, rgba(0, 0, 0, 0.42) 100%);
      opacity: 0.95;
    }
    .hull-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0 23%, rgba(0, 0, 0, 0.18) 24.2%, transparent 26%);
      opacity: 0.52;
    }
    .porthole {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46vmin;
      height: 46vmin;
      min-width: 340px;
      min-height: 340px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(var(--porthole-scale));
      transition: transform 0.08s linear;
    }
    .porthole-frame {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 26px solid rgba(113, 127, 135, 0.82);
      box-shadow:
        inset 0 0 0 2px rgba(227, 239, 244, 0.12),
        inset 0 0 16px rgba(0, 0, 0, 0.2),
        0 18px 44px rgba(0, 0, 0, 0.16);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.08));
    }
    .porthole-frame::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.03);
      opacity: 0.4;
    }
    .porthole-frame::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(24, 36, 46, 0.18);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.12);
    }
    .glass {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(205, 230, 241, 0.16), inset 0 0 30px rgba(0, 0, 0, 0.12);
    }
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.06) 18%, transparent 36%), radial-gradient(circle at 42% 28%, rgba(234, 246, 251, 0.15), transparent 22%);
      opacity: calc(0.7 * var(--hull-visibility));
      transition: opacity 0.08s linear;
    }
    .glass::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6, 18, 28, 0.04), rgba(4, 12, 20, 0.1));
      opacity: calc(0.52 * var(--hull-visibility));
    }
    .rivet {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 15px;
      height: 15px;
      margin-left: -7.5px;
      margin-top: -7.5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, rgba(246, 250, 252, 0.92), rgba(143, 160, 171, 0.94) 56%, rgba(84, 98, 108, 0.98) 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.28), 0 1px 5px rgba(0, 0, 0, 0.18);
    }
    #contact { position: absolute; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    @media (max-width: 1080px) {
      .planet-wrap { right: -5rem; top: -3.2rem; }
      .floor-cards { width: min(82vw, 960px); }
      .testimonials-grid { gap: 3.2rem; }
    }
    @media (max-width: 900px) {
      .about-scroll { height: 600vh; }
      .porthole { width: 74vmin; height: 74vmin; min-width: 280px; min-height: 280px; }
      .about-plaque { top: 1.2rem; }
      .lamp-shell { top: auto; left: -0.1rem; bottom: 24vh; width: 10rem; height: 10rem; }
      .warm-glow { top: auto; left: 0.9rem; bottom: 35vh; width: 9rem; height: 9rem; }
      .planet-wrap { top: -6rem; right: 50%; transform: translateX(50%) scale(0.56); transform-origin: top center; }
      .floor-cards { width: min(96vw, 860px); height: min(32vh, 280px); bottom: -0.8rem; }
      .detail-panel { width: min(92vw, 780px); }
      .testimonials-grid { grid-template-columns: 1fr; gap: 1.2rem; }
      .testimonials-visual { width: min(18rem, 62vw); height: min(420px, 56vh); }
      .testimonials-copy { min-height: auto; text-align: center; }
      .testimonial-controls { justify-content: center; padding-top: 1.5rem; }
      .detail-close { top: -0.6rem; right: 50%; transform: translateX(50%); }
    }
    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { from { opacity: calc(var(--lamp-on) * 0.28); } to { opacity: calc(var(--lamp-on) * 0.42); } }
    @keyframes activePhotoRise {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-80px) scale(1) rotate(0deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>
  <section class="blank-panel"><span>Before About</span></section>
  <section id="aboutScroll" class="about-scroll">
    <div id="aboutStage" class="about-stage">
      <div class="room-scene">
        <div class="room-layer room-dark"></div>
        <div class="room-layer room-lit"></div>
      </div>
      <div class="water-caustics"></div>
      <div class="interior">
        <section class="about-room">
          <div class="about-plaque">About</div>
          <div class="warm-glow"></div>
          <div class="lamp-shell"><div id="lampMount" class="lamp-mount" title="点击切换舱室灯光"></div></div>
          <div class="planet-wrap">
            <div id="planetSystem" class="planet-system"></div>
            <div id="planetToast" class="planet-toast">已复制</div>
          </div>
          <div id="floorCards" class="floor-cards"></div>
          <div id="detailOverlay" class="detail-overlay">
            <div id="detailPanel" class="detail-panel">
              <button id="detailClose" class="detail-close" type="button" aria-label="关闭详情">×</button>
              <div class="testimonials-outer">
                <div class="testimonials-grid">
                  <div><div id="detailVisual" class="testimonials-visual"></div></div>
                  <div class="testimonials-copy">
                    <div id="copyText" class="copy-text">
                      <h3 id="detailName"></h3>
                      <p id="detailDesignation" class="designation"></p>
                      <p id="detailQuote" class="quote"></p>
                    </div>

      { quote: `时间已经过去太久，已经记不清当时的心情了\n当时有一个比较朦胧的想法，在朋友的介绍下认识了[墨间黑沢](https://space.bilibili.com/24271342/dynamic)老师，很快便有了这第一件衣服\n看着脑子里面的想法从模糊到清晰，再到具体，是一种很奇妙的体验。我加入了很多我自己的喜好：白发、蓝瞳、和一点恰到好处的浅浅微笑\n幻象中诞生的少女从纸上走来，很惭愧，我至今没用为她想好一个合适的名字，既然是二次元的“我”，那就以本名 “阵雨” 暂且称呼吧`, name: "初始之服", designation: "阵雨的第一件衣服", src: "../public/assets/oc/oc1.png" },
      { quote: `旗袍的形象很经典，虽其历史不过区区百年，但其展现的温婉曲线美是近乎无可替代的\n由于其发色瞳色，衣服的形象便也非常自然的确定为蓝白色了，青花瓷的一般的少女也应运而生，微微扎起的头发及垂落的鬓尾更将其含蓄而内敛展现地淋漓尽致\n天青色等烟雨，而我在等你`, name: "旗袍", designation: "青花瓷", src: "../public/assets/oc/oc2.png" },

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function mapRange(value, start, end) { return clamp((value - start) / (end - start), 0, 1); }
    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;"); }
    function renderQuoteHtml(text) { return escapeHtml(text).replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g, "<br>"); }
    function updateLampLinkedState() {
      aboutStage.style.setProperty("--lamp-on", lightOn ? "1" : "0");

      updateScrollState();
    }
    function updateScrollState() {
      const rect = aboutScroll.getBoundingClientRect();
      const total = aboutScroll.offsetHeight - window.innerHeight;
      const raw = clamp(-rect.top / Math.max(total, 1), 0, 1);
      const zoomIn = mapRange(raw, 0.05, 0.22);
      const interior = mapRange(raw, 0.16, 0.38);
      const shellFadeOut = mapRange(raw, 0.58, 0.68);
      const fullReveal = mapRange(raw, 0.56, 0.7);
      const linger = mapRange(raw, 0.42, 0.82);
      const exit = mapRange(raw, 0.92, 1);
      const hullVisibility = clamp(1 - shellFadeOut + exit, 0, 1);
      const portholeScale = 1 + zoomIn * 0.72 - exit * 0.06;
      const roomLight = lightOn ? 0.94 + (1 - exit * 0.08) * 0.12 : 0.42 - exit * 0.06;
      const portholeRadius = Math.max(180, Math.min(window.innerWidth, window.innerHeight) * 0.23 * portholeScale);
      const fullRadius = Math.hypot(window.innerWidth, window.innerHeight);
      const revealRadius = Math.round(portholeRadius + (fullRadius - portholeRadius) * fullReveal);
      const interiorStrength = clamp(interior + linger * 0.22, 0, 1);
      aboutStage.style.setProperty("--interior-strength", interiorStrength.toFixed(3));
      aboutStage.style.setProperty("--hull-visibility", hullVisibility.toFixed(3));
      aboutStage.style.setProperty("--porthole-scale", portholeScale.toFixed(3));
      aboutStage.style.setProperty("--room-light", roomLight.toFixed(3));
      aboutStage.style.setProperty("--room-reveal", `${revealRadius}px`);
    }
    function showToast() {
      planetToast.classList.add("show");
      window.clearTimeout(toastTimer);

    }
    function iconMarkup(item) {
      if (item.type === "image") return `<img src="${item.src}" alt="${item.alt}" width="36" height="36">`;
      return `<svg viewBox="${item.viewBox}" aria-hidden="true"><path d="${item.path}"></path></svg>`;
    }
    function renderPlanetSystem() {
      planetSystem.innerHTML = '<div class="planet-core-glow"></div>';
      planetRings.forEach((ring, ringIndex) => {
        const ringLine = document.createElement("div");
        ringLine.className = "planet-ring";
        ringLine.style.width = `${ring.radius * 2}px`;
        ringLine.style.height = `${ring.radius * 2}px`;
        ringLine.style.left = `calc(50% - ${ring.radius}px)`;
        ringLine.style.top = `calc(50% - ${ring.radius}px)`;
        planetSystem.appendChild(ringLine);
        const iconCount = ring.icons.length;
        ring.icons.forEach((item, iconIndex) => {
          const angle = (360 / iconCount) * iconIndex;
          const duration = `${15 + ringIndex * 5}s`;
          const orbit = document.createElement("div");
          orbit.className = "planet-orbit";
          orbit.style.width = `${ring.radius * 2}px`;
          orbit.style.height = `${ring.radius * 2}px`;
          orbit.style.marginLeft = `-${ring.radius}px`;
          orbit.style.marginTop = `-${ring.radius}px`;
          orbit.style.animationDuration = duration;
          orbit.style.animationDelay = `-${(angle / 360) * parseFloat(duration)}s`;
          orbit.style.transform = `rotate(${angle}deg)`;
          const link = document.createElement("a");
          link.className = "planet-icon-link";
          link.href = item.link;
          link.innerHTML = iconMarkup(item);
          link.style.left = `${ring.radius - 20}px`;
          link.style.top = "-20px";
          link.style.transform = `rotate(-${angle}deg) scale(1)`;
          link.target = item.link.startsWith("#") || item.link.startsWith("copy:") ? "_self" : "_blank";
          if (!item.link.startsWith("#") && !item.link.startsWith("copy:")) link.rel = "noopener noreferrer";
          link.addEventListener("mouseenter", () => { orbit.style.animationPlayState = "paused"; link.style.transform = `rotate(-${angle}deg) scale(1.28)`; });
          link.addEventListener("mouseleave", () => { orbit.style.animationPlayState = "running"; link.style.transform = `rotate(-${angle}deg) scale(1)`; });
          link.addEventListener("click", async (event) => {
            if (item.link.startsWith("#")) {
              event.preventDefault();
              const target = document.querySelector(item.link);
              if (target) target.scrollIntoView({ behavior: "smooth" });
              return;
            }
            if (item.link.startsWith("copy:")) {
              event.preventDefault();
              try { await navigator.clipboard.writeText(item.link.replace("copy:", "")); } catch {}
              showToast();
            }
          });
          orbit.appendChild(link);
          planetSystem.appendChild(orbit);
        });
      });
    }
    function lerp(a, b, t) {

    function getCardLayout(index) {
      const blueprint = cardBlueprints[index];
      const width = floorCards.clientWidth || window.innerWidth || 1200;
      const height = floorCards.clientHeight || window.innerHeight || 800;
      const farWidth = clamp(width * 0.075, 54, 82);
      const nearWidth = clamp(width * 0.13, 96, 132);
      const cardWidth = Math.round(farWidth + (nearWidth - farWidth) * blueprint.depth);
      const cardScale = 0.88 + blueprint.depth * 0.18;
      const leftEdge = lerp(floorPlane.topLeft.x, floorPlane.bottomLeft.x, blueprint.v) * width;
      const rightEdge = lerp(floorPlane.topRight.x, floorPlane.bottomRight.x, blueprint.v) * width;
      const centerX = lerp(leftEdge, rightEdge, blueprint.u);
      const centerY = lerp(floorPlane.topLeft.y, floorPlane.bottomLeft.y, blueprint.v) * height;
      return {
        left: Math.round(centerX),
        top: Math.round(centerY),
        width: cardWidth,
        rotate: blueprint.rotate,
        scale: cardScale,
        zIndex: String(10 + Math.round(blueprint.depth * 40))
      };
    }

    function renderFloorCards() {
      floorCards.innerHTML = "";
      testimonials.forEach((item, index) => {
        const layout = getCardLayout(index);
        const button = document.createElement("button");
        button.className = "floor-card";
        button.type = "button";
        button.setAttribute("aria-label", item.name);
        button.dataset.rotate = String(layout.rotate);
        button.style.left = `${layout.left}px`;
        button.style.top = `${layout.top}px`;
        button.style.setProperty("--card-width", `${layout.width}px`);
        button.style.setProperty("--card-rotate", `${layout.rotate}deg`);
        button.style.setProperty("--card-scale", String(layout.scale));
        button.style.zIndex = layout.zIndex;
        button.innerHTML = `<span class="floor-card-frame"><img src="${item.src}" alt="${item.name}" draggable="false"></span>`;
        button.addEventListener("click", () => openDetail(index, button));
        floorCards.appendChild(button);
      });
    }
    function renderDetailCard() {
      detailVisual.innerHTML = "";
      testimonials.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "testimonial-photo";
        if (index === activeTestimonial) card.classList.add("active");
        const isActive = index === activeTestimonial;
        card.style.zIndex = String(isActive ? 40 : testimonials.length + 2 - index);
        card.style.opacity = String(isActive ? 1 : 0.7);
        card.style.transform = `scale(${isActive ? 1 : 0.95}) rotate(${isActive ? 0 : photoRotations[index]}deg)`;
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.name;
        img.draggable = false;
        card.appendChild(img);
        detailVisual.appendChild(card);
      });
      const active = testimonials[activeTestimonial];
      copyText.classList.add("updating");
      window.setTimeout(() => {
        detailName.textContent = active.name;
        detailDesignation.textContent = active.designation;
        detailQuote.innerHTML = renderQuoteHtml(active.quote);
        copyText.classList.remove("updating");
      }, 120);
    }
    function setActiveTestimonial(index) {
      activeTestimonial = (index + testimonials.length) % testimonials.length;
      renderDetailCard();
    }
    function clearFloatingCard() {
      if (floatingCard) {
        floatingCard.remove();
        floatingCard = null;
      }
    }
    function openDetail(index, sourceCard) {
      if (detailBusy || detailOpen) return;
      detailBusy = true;
      detailOpen = true;
      activeTestimonial = index;
      sourceFloorCard = sourceCard;
      renderDetailCard();
      floorCards.classList.add("detail-open");
      detailOverlay.classList.add("is-active");
      sourceFloorCard.classList.add("is-hidden");
      const sourceRect = sourceCard.getBoundingClientRect();
      const ghost = document.createElement("div");
      ghost.className = "floating-card";
      ghost.style.left = `${sourceRect.left}px`;
      ghost.style.top = `${sourceRect.top}px`;
      ghost.style.width = `${sourceRect.width}px`;
      ghost.style.height = `${sourceRect.height}px`;
      ghost.style.transform = `rotate(${sourceCard.dataset.rotate || 0}deg)`;
      ghost.innerHTML = `<img src="${testimonials[index].src}" alt="${testimonials[index].name}">`;
      document.body.appendChild(ghost);
      floatingCard = ghost;
      requestAnimationFrame(() => {
        const targetWidth = window.innerWidth > 900 ? 320 : Math.min(window.innerWidth * 0.5, 280);
        const targetHeight = targetWidth * 1.56;
        ghost.style.left = `${window.innerWidth / 2 - targetWidth / 2}px`;
        ghost.style.top = `${window.innerHeight / 2 - targetHeight / 2}px`;
        ghost.style.width = `${targetWidth}px`;
        ghost.style.height = `${targetHeight}px`;
        ghost.style.transform = "rotate(0deg)";
      });
      window.setTimeout(() => { detailPanel.classList.add("is-visible"); }, 220);
      window.setTimeout(() => { clearFloatingCard(); detailBusy = false; }, 640);
    }
    function closeDetail() {
      if (!detailOpen || detailBusy) return;
      detailBusy = true;
      detailPanel.classList.remove("is-visible");
      window.setTimeout(() => {
        detailOverlay.classList.remove("is-active");
        floorCards.classList.remove("detail-open");
        if (sourceFloorCard) sourceFloorCard.classList.remove("is-hidden");
        sourceFloorCard = null;
        detailOpen = false;
        detailBusy = false;
      }, 220);
    }
    function initLamp() {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, lampMount.clientWidth / lampMount.clientHeight, 0.1, 1000);
      camera.position.set(0, 2, 8);
      camera.lookAt(0, 2, 0);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(lampMount.clientWidth, lampMount.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x000000, 0);
      lampMount.appendChild(renderer.domElement);
      const isMobile = window.innerWidth <= 768;
      const lampGroup = new THREE.Group();
      lampGroup.scale.set(1.2, 1.2, 1.2);
      const whiteMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 100, emissive: 0x333333, emissiveIntensity: 0.2 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 0.3, 16), whiteMaterial);
      base.position.y = 0.15; base.castShadow = true; base.receiveShadow = true; lampGroup.add(base);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3, 8), whiteMaterial);
      pole.position.y = 1.8; pole.castShadow = true; lampGroup.add(pole);
      const joint = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), whiteMaterial);
      joint.position.y = 3.3; joint.castShadow = true; lampGroup.add(joint);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2, 8), whiteMaterial);
      arm.position.set(0.9, 4.25, 0); arm.rotation.z = -Math.PI / 4; arm.castShadow = true; lampGroup.add(arm);
      const shade = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 32, 1, true), new THREE.MeshPhongMaterial({ color: 0xffffff, side: THREE.DoubleSide, shininess: 60, emissive: 0x444444, emissiveIntensity: 0.3 }));
      shade.position.set(2, 5, 0); shade.rotation.z = Math.PI / 4; shade.castShadow = true; lampGroup.add(shade);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 1.2, transparent: true, opacity: 0.95 }));
      bulb.position.set(2, 4.6, 0); bulb.visible = false; lampGroup.add(bulb);
      const spotLight = new THREE.SpotLight(0xffffff, 5.5, 30, Math.PI / 2.5, 0.35, 1.5);
      spotLight.position.set(2, 5, 0); spotLight.target.position.set(0, 2, 0); spotLight.castShadow = true;
      spotLight.shadow.mapSize.width = 2048; spotLight.shadow.mapSize.height = 2048; spotLight.shadow.camera.near = 0.5; spotLight.shadow.camera.far = 40;
      lampGroup.add(spotLight); lampGroup.add(spotLight.target);
      const pointLight = new THREE.PointLight(0xffe066, 2.2, 15);
      pointLight.position.set(2, 4.6, 0); scene.add(pointLight);
      scene.add(new THREE.AmbientLight(0x404040, isMobile ? 0.6 : 0.8));
      const globalLight = new THREE.DirectionalLight(0xffffff, 1);
      globalLight.position.set(5, 10, 5); globalLight.castShadow = true; globalLight.shadow.mapSize.width = 1024; globalLight.shadow.mapSize.height = 1024; scene.add(globalLight);
      scene.add(lampGroup);
      lampState.scene = scene;
      lampState.camera = camera;
      lampState.renderer = renderer;
      lampState.lampGroup = lampGroup;
      lampState.spotLight = spotLight;
      lampState.pointLight = pointLight;
      const animate = () => {
        lampState.animationId = requestAnimationFrame(animate);
        const time = Date.now() * 0.001;
        lampGroup.rotation.y = Math.sin(time * 0.5) * 0.1;
        if (lightOn) {
          spotLight.intensity = 5.5 + Math.sin(time * 1.5) * 0.3;
          pointLight.intensity = 2.2 + Math.sin(time * 1.2) * 0.2;
        } else {
          spotLight.intensity = 0;
          pointLight.intensity = 0;
        }
        renderer.render(scene, camera);
      };
      animate();
    }
    function resizeLamp() {
      if (!lampState.camera || !lampState.renderer) return;
      lampState.camera.aspect = lampMount.clientWidth / lampMount.clientHeight;
      lampState.camera.updateProjectionMatrix();
      lampState.renderer.setSize(lampMount.clientWidth, lampMount.clientHeight);
    }
    function toggleLamp() { lightOn = !lightOn; updateLampLinkedState(); }

    prevTestimonial.addEventListener("click", () => setActiveTestimonial(activeTestimonial - 1));
    nextTestimonial.addEventListener("click", () => setActiveTestimonial(activeTestimonial + 1));
    detailClose.addEventListener("click", closeDetail);
    detailOverlay.addEventListener("click", (event) => { if (event.target === detailOverlay) closeDetail(); });
    lampMount.addEventListener("click", toggleLamp);
    window.addEventListener("keydown", (event) => { if (event.key === "Escape") closeDetail(); });
    window.addEventListener("resize", () => {
      resizeLamp();
      if (detailOpen) {
        renderDetailCard();
      } else {
        renderFloorCards();
      }
      updateScrollState();
    });
    window.addEventListener("scroll", updateScrollState, { passive: true });

    renderPlanetSystem();
    renderFloorCards();
    initLamp();
    updateLampLinkedState();
    updateScrollState();
  </script>
</body>
</html>
