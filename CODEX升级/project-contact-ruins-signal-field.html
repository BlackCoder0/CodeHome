<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Ruins Signal Field Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #020913;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #fieldCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="fieldCanvas"></canvas>

  <script>
    class Particle {
      constructor(x, y, color) {
        this.originalX = x;
        this.originalY = y;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.baseColor = color;
      }

      update(mouseX, mouseY) {
        if (
          mouseX < -999 &&
          Math.abs(this.vx) + Math.abs(this.vy) +
            Math.abs(this.originalX - this.x) +
            Math.abs(this.originalY - this.y) < 0.02
        ) {
          return;
        }

        const dx = this.x - mouseX;
        const dy = this.y - mouseY;
        const distance = Math.hypot(dx, dy);
        const repulsionRadius = 84;
        const repulsionForce = 2.1;
        const friction = 0.08;
        const returnSpeed = 0.01;

        if (distance < repulsionRadius) {
          const angle = Math.atan2(dy, dx);
          const ratio = (repulsionRadius - distance) / repulsionRadius;
          const force = ratio * ratio * repulsionForce;
          this.vx += Math.cos(angle) * force;
          this.vy += Math.sin(angle) * force;
        }

        this.vx += (this.originalX - this.x) * returnSpeed;
        this.vy += (this.originalY - this.y) * returnSpeed;

        this.vx *= 1 - friction;
        this.vy *= 1 - friction;

        this.x += this.vx;
        this.y += this.vy;
      }

      draw(ctx) {
        ctx.fillStyle = this.baseColor;
        ctx.fillRect(this.x, this.y, 2, 2);
      }
    }

    const canvas = document.getElementById("fieldCanvas");
    const ctx = canvas.getContext("2d");
    const particles = [];
    const dust = [];
    const mouse = { x: -1000, y: -1000 };

    let width = 0;
    let height = 0;
    let dpr = 1;
    let time = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function terrainY(xNorm) {
      return (
        height * 0.69 +
        Math.sin(xNorm * Math.PI * 1.4 + 0.18) * height * 0.07 +
        Math.sin(xNorm * Math.PI * 3.1 - 0.86) * height * 0.038 +
        Math.sin(xNorm * Math.PI * 7.2 + 1.3) * height * 0.014
      );
    }

    function roundRectPath(target, x, y, w, h, r) {
      target.beginPath();
      target.moveTo(x + r, y);
      target.lineTo(x + w - r, y);
      target.quadraticCurveTo(x + w, y, x + w, y + r);
      target.lineTo(x + w, y + h - r);
      target.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      target.lineTo(x + r, y + h);
      target.quadraticCurveTo(x, y + h, x, y + h - r);
      target.lineTo(x, y + r);
      target.quadraticCurveTo(x, y, x + r, y);
      target.closePath();
    }

    function drawTerrainMask(target) {
      target.fillStyle = "#ffffff";
      target.beginPath();
      target.moveTo(0, height);
      for (let x = 0; x <= width; x += 8) {
        target.lineTo(x, terrainY(x / width));
      }
      target.lineTo(width, height);
      target.closePath();
      target.fill();

      const ruins = [
        { x: width * 0.24, y: terrainY(0.24), w: width * 0.072, h: height * 0.12, type: "pillar" },
        { x: width * 0.49, y: terrainY(0.49), w: width * 0.12, h: height * 0.17, type: "gate" },
        { x: width * 0.75, y: terrainY(0.75), w: width * 0.064, h: height * 0.1, type: "pillar" }
      ];

      for (const ruin of ruins) {
        if (ruin.type === "gate") {
          target.beginPath();
          target.moveTo(ruin.x - ruin.w * 0.5, ruin.y);
          target.lineTo(ruin.x - ruin.w * 0.28, ruin.y - ruin.h);
          target.lineTo(ruin.x + ruin.w * 0.28, ruin.y - ruin.h);
          target.lineTo(ruin.x + ruin.w * 0.5, ruin.y);
          target.closePath();
          target.fill();
          target.clearRect(ruin.x - ruin.w * 0.1, ruin.y - ruin.h * 0.54, ruin.w * 0.2, ruin.h * 0.54);
        } else {
          target.fillRect(ruin.x - ruin.w * 0.5, ruin.y - ruin.h, ruin.w, ruin.h);
          target.clearRect(ruin.x - ruin.w * 0.12, ruin.y - ruin.h * 0.42, ruin.w * 0.24, ruin.h * 0.42);
        }
      }

      target.strokeStyle = "#ffffff";
      target.lineWidth = Math.max(2, width * 0.0024);
      target.beginPath();
      target.moveTo(width * 0.06, height * 0.76);
      target.bezierCurveTo(width * 0.22, height * 0.73, width * 0.42, height * 0.84, width * 0.6, height * 0.77);
      target.bezierCurveTo(width * 0.75, height * 0.72, width * 0.88, height * 0.82, width * 0.96, height * 0.76);
      target.stroke();
    }

    function generateParticles() {
      particles.length = 0;

      const spacing = width < 900 ? 8 : 8;
      const tempCanvas = document.createElement("canvas");
      const tempCtx = tempCanvas.getContext("2d");
      tempCanvas.width = width;
      tempCanvas.height = height;

      drawTerrainMask(tempCtx);

      const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const data = imageData.data;

      for (let y = 0; y < tempCanvas.height; y += spacing) {
        for (let x = 0; x < tempCanvas.width; x += spacing) {
          const index = (y * tempCanvas.width + x) * 4;
          const alpha = data[index + 3];
          if (alpha <= 128) continue;

          const brightness = (data[index] + data[index + 1] + data[index + 2]) / 3;
          const whiteIntensity = Math.max(0.3, brightness / 255);
          const color = `rgba(255, 255, 255, ${whiteIntensity})`;
          particles.push(new Particle(x, y, color));
        }
      }
    }

    function seedDust() {
      dust.length = 0;
      const count = width < 900 ? 54 : 92;
      for (let i = 0; i < count; i += 1) {
        dust.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.4 + 0.5,
          alpha: Math.random() * 0.18 + 0.03,
          speed: Math.random() * 0.32 + 0.08
        });
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      generateParticles();
      seedDust();
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "rgba(10, 37, 58, 1)");
      grad.addColorStop(0.46, "rgba(4, 19, 31, 1)");
      grad.addColorStop(1, "rgba(2, 8, 14, 1)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const glow = ctx.createRadialGradient(width * 0.5, height * 0.08, 0, width * 0.5, height * 0.08, width * 0.42);
      glow.addColorStop(0, "rgba(230, 247, 255, 0.08)");
      glow.addColorStop(1, "rgba(230, 247, 255, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
    }

    function drawDust() {
      for (const mote of dust) {
        mote.y += mote.speed;
        mote.x += Math.sin(time * 0.4 + mote.y * 0.01) * 0.12;
        if (mote.y > height + 12) {
          mote.y = -12;
          mote.x = Math.random() * width;
        }
        ctx.beginPath();
        ctx.fillStyle = `rgba(194, 226, 236, ${mote.alpha})`;
        ctx.arc(mote.x, mote.y, mote.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSignalEcho() {
      if (mouse.x < 0) return;
      ctx.save();
      ctx.strokeStyle = "rgba(143, 232, 255, 0.16)";
      ctx.lineWidth = 1.1;
      for (let i = 0; i < 4; i += 1) {
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 28 + i * 22 + Math.sin(time * 1.8) * 3, -Math.PI * 0.24, Math.PI * 1.06);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTerrainOutline() {
      ctx.strokeStyle = "rgba(214, 244, 255, 0.16)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(0, terrainY(0));
      for (let x = 0; x <= width; x += 10) {
        ctx.lineTo(x, terrainY(x / width));
      }
      ctx.stroke();
    }

    function drawTitle() {
      ctx.fillStyle = "rgba(222, 242, 249, 0.72)";
      ctx.font = "600 13px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
      ctx.fillText("CONTACT RUINS SIGNAL FIELD", 24, 34);
      ctx.fillStyle = "rgba(241, 248, 252, 0.94)";
      ctx.font = "600 38px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
      ctx.fillText("沿用原 Contact 点阵逻辑", 24, 80);
      ctx.fillStyle = "rgba(177, 214, 227, 0.68)";
      ctx.font = "500 16px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
      ctx.fillText("但采样形状改成海底地形、线缆和遗迹，而不是 logo", 28, 108);
    }

    function render() {
      time += 0.016;
      drawBackground();
      drawDust();

      for (const particle of particles) {
        particle.update(mouse.x, mouse.y);
        particle.draw(ctx);
      }

      drawTerrainOutline();
      drawSignalEcho();
      drawTitle();
      requestAnimationFrame(render);
    }

    window.addEventListener("pointermove", (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    });

    window.addEventListener("pointerleave", () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    resize();
    render();
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
